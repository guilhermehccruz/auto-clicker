name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Must match the github.com/wailsapp/wails/v3 version in go.mod.
  WAILS_VERSION: v3.0.0-beta.25
  NODE_VERSION: "22"

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: wails3 build GOOS=linux

      - uses: actions/upload-artifact@v4
        with:
          name: auto-clicker-linux
          path: bin/auto-clicker
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Cross-compiled from Linux: the robotgo backends are pure Go and Wails
      # needs no CGO on Windows.
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: wails3 build GOOS=windows

      - uses: actions/upload-artifact@v4
        with:
          name: auto-clicker-windows
          path: bin/auto-clicker.exe
          if-no-files-found: error

  package:
    name: Package release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: auto-clicker-linux
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: auto-clicker-windows
          path: dist/windows

      - name: Build archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"

          cat > README.txt <<'EOF'
          Auto Clicker

          Run the binary to start the app. No installation is required.
          EOF

          mkdir -p linux
          cp dist/linux/auto-clicker linux/
          chmod +x linux/auto-clicker
          cp README.txt linux/
          tar -C linux -czf "auto-clicker_${version}_linux_amd64.tar.gz" auto-clicker README.txt

          mkdir -p windows
          cp dist/windows/auto-clicker.exe windows/
          cp README.txt windows/
          (cd windows && zip -q "auto-clicker_${version}_windows_amd64.zip" auto-clicker.exe README.txt)

          ls -l auto-clicker_*.tar.gz auto-clicker_*.zip

      # Draft first: the release appears on the page, you smoke-test the
      # binaries, then publish it manually.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            auto-clicker_${{ github.ref_name }}_linux_amd64.tar.gz
            auto-clicker_${{ github.ref_name }}_windows_amd64.zip
