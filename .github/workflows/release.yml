name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Must match the github.com/wailsapp/wails/v3 version in go.mod.
  WAILS_VERSION: v3.0.0-beta.25
  NODE_VERSION: "22"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A pushed tag is the version, e.g. v1.2.3.
            version="${GITHUB_REF_NAME}"
          else
            # Auto-version every main/dispatch build so the release tag is unique.
            version="v0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

  build-linux:
    name: Build Linux
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: |
          # The CLI links the Wails operatingsystem package; -tags gtk3 selects
          # the GTK3/WebKit2GTK-4.1 backend this project targets (the default
          # build expects GTK4/WebKitGTK-6.0).
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: wails3 build GOOS=linux

      - name: Collect binary
        run: |
          mkdir -p out
          cp bin/auto-clicker out/

      - uses: actions/upload-artifact@v4
        with:
          name: auto-clicker-linux
          path: out/
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Needed even for the cross-build: the Wails CLI and the binding generator
      # type-check the app on the Linux host, where -tags gtk3 selects the
      # GTK3/WebKit2GTK-4.1 backend.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: |
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Cross-compiled from Linux: the robotgo backends are pure Go and Wails
      # needs no CGO on Windows. EXTRA_TAGS=gtk3 keeps the host-side binding
      # generation on the GTK3 backend instead of the default GTK4 one.
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CGO_ENABLED: "0"
          EXTRA_TAGS: "gtk3"
        run: wails3 build GOOS=windows

      - name: Collect binary
        run: |
          mkdir -p out
          cp bin/auto-clicker.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: auto-clicker-windows
          path: out/
          if-no-files-found: error

  package:
    name: Publish release
    needs: [version, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: auto-clicker-linux
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: auto-clicker-windows
          path: dist/windows

      - name: Build archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          cat > README.txt <<'EOF'
          Auto Clicker

          Run the binary to start the app. No installation is required.
          EOF

          mkdir -p linux
          cp dist/linux/auto-clicker linux/
          chmod +x linux/auto-clicker
          cp README.txt linux/
          tar -C linux -czf "auto-clicker_${VERSION}_linux_amd64.tar.gz" auto-clicker README.txt

          mkdir -p windows
          cp dist/windows/auto-clicker.exe windows/
          cp README.txt windows/
          (cd windows && zip -q "auto-clicker_${VERSION}_windows_amd64.zip" auto-clicker.exe README.txt)

          ls -l auto-clicker_*.tar.gz auto-clicker_*.zip

      # Publishes directly (not a draft) so the binaries are downloadable from
      # the Releases page as soon as the build finishes.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: |
            auto-clicker_${{ needs.version.outputs.version }}_linux_amd64.tar.gz
            auto-clicker_${{ needs.version.outputs.version }}_windows_amd64.zip
